name: 全自动编译OpenROAD（自动修复所有编译问题）
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-openroad:
    runs-on: ubuntu-22.04
    steps:
      - name: 1. 检出代码+自动拉取所有第三方子模块（解决目录缺失报错）
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: 2. 安装OpenROAD全量系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake g++ make ninja-build git \
            libboost-all-dev libeigen3-dev libspdlog-dev nlohmann-json3-dev \
            libreadline-dev tcl-dev zlib1g-dev libffi-dev bison flex \
            libpcre2-dev autoconf automake libtool python3 python3-pip

      - name: 3. 卸载旧版SWIG+编译安装SWIG 4.3.0（解决版本过低报错）
        run: |
          sudo apt-get remove -y swig swig4.0 || true
          sudo apt autoremove -y
          
          cd /tmp
          wget -q https://github.com/swig/swig/archive/refs/tags/v4.3.0.tar.gz
          tar xzf v4.3.0.tar.gz
          cd swig-4.3.0
          ./autogen.sh
          ./configure --prefix=/usr/local
          make -j$(nproc)
          sudo make install
          
          swig -version

      - name: 4. 配置CMake+全量编译OpenROAD
        run: |
          cd src/openroad
          rm -rf build
          mkdir build && cd build
          cmake ..
          make -j$(nproc)

      - name: 5. 自动上传编译完成的OpenROAD产物
        uses: actions/upload-artifact@v4
        with:
          name: OpenROAD-编译完成产物
          path: src/openroad/build/bin/
          retention-days: 30
