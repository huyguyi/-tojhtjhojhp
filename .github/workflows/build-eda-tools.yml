# ============================================================
# BUXLU-EDA 开源工具自动编译工作流
# 功能：在 Ubuntu 环境下自动编译 11 个开源 EDA 工具
# 编译产物：可执行文件打包为 GitHub Actions Artifact
# ============================================================

name: BUXLU-EDA 开源工具编译

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # 允许手动触发

env:
  BUILD_TYPE: Release
  INSTALL_PREFIX: ${{ github.workspace }}/install

jobs:
  # ============================================================
  # Job 1: 安装系统依赖
  # ============================================================
  install-dependencies:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 🔧 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            g++ \
            gcc \
            make \
            ninja-build \
            git \
            wget \
            curl \
            python3 \
            python3-pip \
            python3-dev \
            libboost-all-dev \
            libeigen3-dev \
            libspdlog-dev \
            nlohmann-json3-dev \
            libreadline-dev \
            tcl-dev \
            tk-dev \
            zlib1g-dev \
            libffi-dev \
            libssl-dev \
            swig \
            bison \
            flex \
            autoconf \
            automake \
            libtool \
            pkg-config \
            qtbase5-dev \
            qttools5-dev \
            libqt5svg5-dev \
            libqt5opengl5-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libx11-dev \
            libxrender-dev \
            libxext-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libxcb-xinerama0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-sync1 \
            libxcb-xfixes0

      - name: ✅ 验证工具版本
        run: |
          echo "=== 编译工具版本 ==="
          gcc --version
          g++ --version
          cmake --version
          make --version
          python3 --version

  # ============================================================
  # Job 2: 编译 OpenROAD（修复 SWIG 版本）
  # ============================================================
  build-openroad:
    needs: install-dependencies
    runs-on: ubuntu-latest
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 🔧 安装依赖（修复SWIG）
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake g++ make ninja-build git \
            libboost-all-dev libeigen3-dev libspdlog-dev nlohmann-json3-dev \
            libreadline-dev tcl-dev zlib1g-dev libffi-dev bison flex
          
          # 卸载旧版 SWIG 并安装新版
          sudo apt-get remove -y swig
          cd /tmp
          wget -q https://github.com/swig/swig/archive/refs/tags/v4.3.0.tar.gz
          tar xzf v4.3.0.tar.gz
          cd swig-4.3.0
          ./autogen.sh
          ./configure --prefix=/usr/local
          make -j$(nproc)
          sudo make install
          sudo ldconfig
          swig -version

      - name: 🏗️ 编译 OpenROAD
        working-directory: ${{ github.workspace }}/src/openroad
        run: |
          mkdir -p build && cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_INSTALL_PREFIX=${{ env.INSTALL_PREFIX }}/openroad
          make -j$(nproc)
          make install

      - name: 📦 打包 OpenROAD 产物
        run: |
          mkdir -p artifacts/openroad
          cp -r ${{ env.INSTALL_PREFIX }}/openroad/* artifacts/openroad/ 2>/dev/null || true
          find ${{ github.workspace }}/src/openroad/build -type f -executable \
            -exec cp {} artifacts/openroad/ \; 2>/dev/null || true

      - name: ⬆️ 上传 OpenROAD 产物
        uses: actions/upload-artifact@v4
        with:
          name: openroad-executables
          path: artifacts/openroad/
          retention-days: 30
  # ============================================================
  # Job 3: 编译 OpenSTA（CMake）
  # ============================================================
  build-opensta:
    needs: install-dependencies
    runs-on: ubuntu-latest
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 🔧 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake g++ make git \
            libboost-all-dev tcl-dev zlib1g-dev

      - name: 🏗️ 编译 OpenSTA
        working-directory: ${{ github.workspace }}/src/opensta
        run: |
          mkdir -p build && cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_INSTALL_PREFIX=${{ env.INSTALL_PREFIX }}/opensta
          make -j$(nproc)
          make install

      - name: 📦 打包 OpenSTA 产物
        run: |
          mkdir -p artifacts/opensta
          cp -r ${{ env.INSTALL_PREFIX }}/opensta/* artifacts/opensta/ 2>/dev/null || true
          find ${{ github.workspace }}/src/opensta/build -type f -executable \
            -exec cp {} artifacts/opensta/ \; 2>/dev/null || true

      - name: ⬆️ 上传 OpenSTA 产物
        uses: actions/upload-artifact@v4
        with:
          name: opensta-executables
          path: artifacts/opensta/
          retention-days: 30

  # ============================================================
  # Job 4: 编译 Yosys（Makefile）
  # ============================================================
  build-yosys:
    needs: install-dependencies
    runs-on: ubuntu-latest
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 🔧 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential g++ make git \
            libreadline-dev tcl-dev bison flex libffi-dev

      - name: 🏗️ 编译 Yosys
        working-directory: ${{ github.workspace }}/src/yosys
        run: |
          make -j$(nproc) PREFIX=${{ env.INSTALL_PREFIX }}/yosys
          make install PREFIX=${{ env.INSTALL_PREFIX }}/yosys

      - name: 📦 打包 Yosys 产物
        run: |
          mkdir -p artifacts/yosys
          cp -r ${{ env.INSTALL_PREFIX }}/yosys/* artifacts/yosys/ 2>/dev/null || true
          find ${{ github.workspace }}/src/yosys -type f -executable \
            -exec cp {} artifacts/yosys/ \; 2>/dev/null || true

      - name: ⬆️ 上传 Yosys 产物
        uses: actions/upload-artifact@v4
        with:
          name: yosys-executables
          path: artifacts/yosys/
          retention-days: 30

  # ============================================================
  # Job 5: 编译 KLayout（CMake + Qt）
  # ============================================================
  build-klayout:
    needs: install-dependencies
    runs-on: ubuntu-latest
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 🔧 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake g++ make git \
            qtbase5-dev qttools5-dev libqt5svg5-dev libqt5opengl5-dev \
            libboost-all-dev python3-dev zlib1g-dev libx11-dev

      - name: 🏗️ 编译 KLayout
        working-directory: ${{ github.workspace }}/src/klayout
        run: |
          mkdir -p build && cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_INSTALL_PREFIX=${{ env.INSTALL_PREFIX }}/klayout
          make -j$(nproc)
          make install

      - name: 📦 打包 KLayout 产物
        run: |
          mkdir -p artifacts/klayout
          cp -r ${{ env.INSTALL_PREFIX }}/klayout/* artifacts/klayout/ 2>/dev/null || true
          find ${{ github.workspace }}/src/klayout/build -type f -executable \
            -exec cp {} artifacts/klayout/ \; 2>/dev/null || true

      - name: ⬆️ 上传 KLayout 产物
        uses: actions/upload-artifact@v4
        with:
          name: klayout-executables
          path: artifacts/klayout/
          retention-days: 30

  # ============================================================
  # Job 6: 编译 OpenTimer（CMake）
  # ============================================================
  build-opentimer:
    needs: install-dependencies
    runs-on: ubuntu-latest
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 🔧 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake g++ make git

      - name: 🏗️ 编译 OpenTimer
        working-directory: ${{ github.workspace }}/src/opentimer
        run: |
          mkdir -p build && cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_INSTALL_PREFIX=${{ env.INSTALL_PREFIX }}/opentimer
          make -j$(nproc)
          make install

      - name: 📦 打包 OpenTimer 产物
        run: |
          mkdir -p artifacts/opentimer
          cp -r ${{ env.INSTALL_PREFIX }}/opentimer/* artifacts/opentimer/ 2>/dev/null || true
          find ${{ github.workspace }}/src/opentimer/build -type f -executable \
            -exec cp {} artifacts/opentimer/ \; 2>/dev/null || true

      - name: ⬆️ 上传 OpenTimer 产物
        uses: actions/upload-artifact@v4
        with:
          name: opentimer-executables
          path: artifacts/opentimer/
          retention-days: 30

  # ============================================================
  # Job 7: 编译 netgen（Makefile / Autoconf）
  # ============================================================
  build-netgen:
    needs: install-dependencies
    runs-on: ubuntu-latest
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 🔧 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential g++ make git \
            autoconf automake libtool tcl-dev tk-dev

      - name: 🏗️ 编译 netgen
        working-directory: ${{ github.workspace }}/src/netgen
        run: |
          # 尝试 Autoconf 流程
          if [ -f configure.ac ] || [ -f configure.in ]; then
            autoreconf -fi || true
            ./configure --prefix=${{ env.INSTALL_PREFIX }}/netgen
            make -j$(nproc)
            make install
          # 尝试 Makefile 直接编译
          elif [ -f Makefile ] || [ -f makefile ]; then
            make -j$(nproc) PREFIX=${{ env.INSTALL_PREFIX }}/netgen
            make install PREFIX=${{ env.INSTALL_PREFIX }}/netgen || true
          fi

      - name: 📦 打包 netgen 产物
        run: |
          mkdir -p artifacts/netgen
          cp -r ${{ env.INSTALL_PREFIX }}/netgen/* artifacts/netgen/ 2>/dev/null || true
          find ${{ github.workspace }}/src/netgen -type f -executable \
            -exec cp {} artifacts/netgen/ \; 2>/dev/null || true

      - name: ⬆️ 上传 netgen 产物
        uses: actions/upload-artifact@v4
        with:
          name: netgen-executables
          path: artifacts/netgen/
          retention-days: 30

  # ============================================================
  # Job 8: 打包所有 Python 工具（不需要编译）
  # ============================================================
  package-python-tools:
    needs: install-dependencies
    runs-on: ubuntu-latest
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 📦 打包 Python 工具源码
        run: |
          mkdir -p artifacts/python-tools
          # OpenLane（Python 调度器）
          if [ -d "${{ github.workspace }}/src/openlane" ]; then
            cp -r ${{ github.workspace }}/src/openlane artifacts/python-tools/ 2>/dev/null || true
          fi
          # cocotb（Python 验证框架）
          if [ -d "${{ github.workspace }}/src/cocotb" ]; then
            cp -r ${{ github.workspace }}/src/cocotb artifacts/python-tools/ 2>/dev/null || true
          fi
          # OpenFASOC（Python 模拟设计）
          if [ -d "${{ github.workspace }}/src/openfasoc" ]; then
            cp -r ${{ github.workspace }}/src/openfasoc artifacts/python-tools/ 2>/dev/null || true
          fi

      - name: ⬆️ 上传 Python 工具源码
        uses: actions/upload-artifact@v4
        with:
          name: python-tools-source
          path: artifacts/python-tools/
          retention-days: 30

  # ============================================================
  # Job 9: 汇总报告
  # ============================================================
  build-summary:
    needs:
      - build-openroad
      - build-opensta
      - build-yosys
      - build-klayout
      - build-opentimer
      - build-netgen
      - package-python-tools
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: 📊 生成编译汇总报告
        run: |
          echo "# BUXLU-EDA 编译汇总报告" > build-report.md
          echo "" >> build-report.md
          echo "编译时间：$(date '+%Y-%m-%d %H:%M:%S')" >> build-report.md
          echo "运行环境：ubuntu-latest" >> build-report.md
          echo "" >> build-report.md
          echo "## 编译状态" >> build-report.md
          echo "| 工具 | 构建系统 | 状态 |" >> build-report.md
          echo "|------|----------|------|" >> build-report.md
          echo "| OpenROAD | CMake | ${{ needs.build-openroad.result }} |" >> build-report.md
          echo "| OpenSTA | CMake | ${{ needs.build-opensta.result }} |" >> build-report.md
          echo "| Yosys | Makefile | ${{ needs.build-yosys.result }} |" >> build-report.md
          echo "| KLayout | CMake | ${{ needs.build-klayout.result }} |" >> build-report.md
          echo "| OpenTimer | CMake | ${{ needs.build-opentimer.result }} |" >> build-report.md
          echo "| netgen | Makefile | ${{ needs.build-netgen.result }} |" >> build-report.md
          echo "| Python工具 | 无需编译 | ${{ needs.package-python-tools.result }} |" >> build-report.md
          echo "" >> build-report.md
          echo "## 产物下载" >> build-report.md
          echo "请在 GitHub Actions 页面下载以下 Artifact：" >> build-report.md
          echo "- \`openroad-executables\`" >> build-report.md
          echo "- \`opensta-executables\`" >> build-report.md
          echo "- \`yosys-executables\`" >> build-report.md
          echo "- \`klayout-executables\`" >> build-report.md
          echo "- \`opentimer-executables\`" >> build-report.md
          echo "- \`netgen-executables\`" >> build-report.md
          echo "- \`python-tools-source\`" >> build-report.md
          cat build-report.md

      - name: ⬆️ 上传汇总报告
        uses: actions/upload-artifact@v4
        with:
          name: build-summary-report
          path: build-report.md
          retention-days: 90
